version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: sorolens_test
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: ../../apps/api
    environment:
      DATABASE_URL: postgres://postgres:test@postgres:5432/sorolens_test
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
